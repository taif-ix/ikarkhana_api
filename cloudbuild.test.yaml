# Cloud Build pipeline to build Dockerfile.test and deploy test.py to Cloud Run.
# Run with:
# gcloud builds submit --project gen-lang-client-0148520460 --config cloudbuild.test.yaml

substitutions:
  _SERVICE_NAME: ikarkhana-test
  _REGION: asia-south1
  _PROJECT_ID: gen-lang-client-0148520460
  _REPOSITORY: cloud-run-source-deploy
  _IMAGE_NAME: ikarkhana-test
  _GEMINI_PROVIDER: vertex_ai
  _GEMINI_MODEL: gemini-2.5-pro

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.test
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --project
      - ${_PROJECT_ID}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - '2Gi'
      - --cpu
      - '2'
      - --timeout
      - '900'
      - --port
      - '8080'
      - --set-env-vars
      - GEMINI_PROVIDER=${_GEMINI_PROVIDER},GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GEMINI_MODEL=${_GEMINI_MODEL},PYVISTA_OFF_SCREEN=true
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8